<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>%TITLE%</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/swagger-ui-dist@5.32.5/swagger-ui.css"
    />
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5.32.5/swagger-ui-bundle.js"></script>
    <script>
      const OPENAPI_SPEC = %OPENAPI_SPEC%;
      window.ui = SwaggerUIBundle({
        spec: OPENAPI_SPEC,
        dom_id: "#swagger-ui",
        deepLinking: true,
        tryItOutEnabled: true,
        presets: [SwaggerUIBundle.presets.apis],
        layout: "BaseLayout",
      });
    </script>
  </body>
</html>
